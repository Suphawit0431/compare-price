<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koommai">
<link rel="apple-touch-icon" href="Koom_mai_logo.png">
<title>Koommai คุ้มมั้ย — เปรียบเทียบราคาต่อหน่วย</title>
<style>
  :root {
    --bg: #0D1117; --panel: #161B22; --panel2: #1C2128;
    --line: #30363D; --fg: #E6EDF3; --muted: #8B949E;
    --green: #2EA043; --green-accent: #39FF14; --red: #F85149;
    --amber: #E3B341; --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", "Noto Sans Thai", sans-serif;
  }
  .wrap {
    max-width: 580px; margin: 0 auto;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(60px, env(safe-area-inset-bottom));
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  .fx-widget { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .fx-switch { display: flex; background: var(--panel2); border-radius: 8px; padding: 2px; gap: 2px; }
  .fx-btn { border: none; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .fx-btn.active { background: var(--green-accent); color: #0D1117; }
  .fx-rate-sub { font-size: 10px; color: var(--muted); padding-right: 4px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .idx { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  input, select { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); padding: 11px 12px; font-size: 16px; }
  input:focus, select:focus { outline: none; border-color: var(--green-accent); }
  select { appearance: none; -webkit-appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238B949E%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 12px center; background-size: 10px; padding-right: 32px; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > * { flex: 1; min-width: 0; }
  label { display: block; font-size: 11px; color: var(--muted); margin: 0 0 5px; font-weight: 500; }
  .del { min-width: 44px; min-height: 44px; background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .del:active { color: var(--red); background: rgba(248, 81, 73, 0.1); }
  .actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 16px 0; }
  .btn { border-radius: var(--radius); padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; border: 1px solid transparent; display: flex; align-items: center; justify-content: center; }
  .btn:active { transform: scale(0.98); }
  .btn-add { background: var(--panel); border-color: var(--line); color: var(--fg); }
  .btn-go { background: var(--green-accent); color: #0D1117; font-size: 17px; font-weight: 700; }
  #results { margin-top: 24px; display: none; }
  .res { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; position: relative; }
  .res.best { border-color: var(--green-accent); box-shadow: 0 0 0 1px var(--green-accent) inset; }
  .res .name { font-weight: 700; font-size: 16px; margin-bottom: 4px; padding-right: 90px; }
  .res .unit { font-size: 22px; font-weight: 800; margin: 6px 0; }
  .res.best .unit { color: var(--green-accent); }
  .res .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .badge { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 700; background: var(--green-accent); color: #0D1117; padding: 4px 8px; border-radius: 12px; }
  .badge.lose { background: var(--panel2); color: var(--red); border: 1px solid var(--red); }
  .note, .warn { border-radius: var(--radius); padding: 14px; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
  .note { background: var(--panel2); border: 1px solid var(--amber); }
  .note b { color: var(--amber); }
  .warn { background: var(--panel2); border: 1px solid var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Koommai คุ้มมั้ย 💸</h1>
      <p class="sub">เปรียบเทียบราคาต่อหน่วย คำนวณส่วนลด & โปรโมชัน</p>
    </div>
    <div class="fx-widget">
      <div class="fx-switch" id="fxSwitch">
        <button type="button" class="fx-btn active" data-cur="THB">THB</button>
        <button type="button" class="fx-btn" data-cur="AUD">AUD</button>
        <button type="button" class="fx-btn" data-cur="USD">USD</button>
      </div>
      <div class="fx-rate-sub" id="fxRateLabel">1 AUD ≈ -- THB</div>
    </div>
  </header>

  <div id="items"></div>

  <div class="actions">
    <button type="button" class="btn btn-add" id="addBtn">+ เพิ่มสินค้า</button>
    <button type="button" class="btn btn-go" id="goBtn">เปรียบเทียบราคา</button>
  </div>

  <div id="results"></div>
</div>

<!-- Load Main App as ES Module -->
<script type="module" src="app.js"></script>
</body>
</html>
